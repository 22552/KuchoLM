<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KuchoLM NIDA Web</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>KuchoLM NIDA</h1>
      <p>完全ブラウザ内で動く、日本語口調変換デモ。</p>
    </header>

    <section class="panel">
      <label for="model">Model</label>
      <select id="model">
        <option value="10m" selected>NIDA-10M</option>
      </select>

      <label for="input">Input</label>
      <textarea id="input" rows="7" placeholder="今日は学校です。"></textarea>

      <button id="convert" disabled>Loading model…</button>

      <div class="status" id="status">初回はモデルをダウンロードします。2回目以降は端末キャッシュを使用します。</div>

      <label for="output">Output</label>
      <textarea id="output" rows="7" readonly></textarea>
    </section>

    <footer>
      <p>入力文はサーバーへ送信されません。</p>
      <p><a href="https://huggingface.co/h6e/KuchoLM-NIDA-10M" target="_blank" rel="noreferrer">KuchoLM-NIDA-10M on Hugging Face</a></p>
    </footer>
  </main>

  <script type="module">
    if ('serviceWorker' in navigator) {
      try {
        await navigator.serviceWorker.register('./sw.js');
        await navigator.serviceWorker.ready;
        if (!navigator.serviceWorker.controller) {
          await new Promise((resolve) => {
            navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true });
          });
        }
      } catch (err) {
        console.warn('Service Worker registration failed:', err);
      }
    }
    await import('./app.js');
  </script>
</body>
</html>
